<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>רומא</title>
  <meta name="description" content="מדריך טיול לרומא ופירנצה">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="רומא">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar" id="navbar" data-scrolled="false">
    <div class="nav-leading">
      <button class="icon-btn glass-circle" id="back" hidden aria-label="חזרה">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5l7.5 7.5L9 19.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="navbar-title" id="title" aria-hidden="true"></div>
    <div class="nav-trailing" id="nav-actions"></div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar glass" aria-label="ניווט ראשי">
    <a class="tab" href="#/today" data-tab="today">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.6" fill="currentColor"/><path d="M12 2.2v2.3M12 19.5v2.3M2.2 12h2.3M19.5 12h2.3M5.1 5.1l1.6 1.6M17.3 17.3l1.6 1.6M5.1 18.9l1.6-1.6M17.3 6.7l1.6-1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>היום</span>
    </a>
    <a class="tab" href="#/plan" data-tab="plan">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M6 3.5h12A2.5 2.5 0 0 1 20.5 6v12a2.5 2.5 0 0 1-2.5 2.5H6A2.5 2.5 0 0 1 3.5 18V6A2.5 2.5 0 0 1 6 3.5zM5.5 9v9a.5.5 0 0 0 .5.5h12a.5.5 0 0 0 .5-.5V9z"/><g fill="currentColor"><circle cx="8.5" cy="12.3" r="1.15"/><circle cx="12" cy="12.3" r="1.15"/><circle cx="15.5" cy="12.3" r="1.15"/><circle cx="8.5" cy="15.7" r="1.15"/><circle cx="12" cy="15.7" r="1.15"/></g></svg>
      <span>לו״ז</span>
    </a>
    <a class="tab" href="#/places" data-tab="places">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M12 2.5a7 7 0 0 0-7 7c0 5.2 7 12 7 12s7-6.8 7-12a7 7 0 0 0-7-7zm0 4.3a2.7 2.7 0 1 1 0 5.4 2.7 2.7 0 0 1 0-5.4z"/></svg>
      <span>מקומות</span>
    </a>
    <a class="tab" href="#/info" data-tab="info">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M12 2.5a9.5 9.5 0 1 1 0 19 9.5 9.5 0 0 1 0-19zm0 4.6a1.35 1.35 0 1 0 0 2.7 1.35 1.35 0 0 0 0-2.7zM10.6 11h2.8v6.3h-2.8z"/></svg>
      <span>מידע</span>
    </a>
    <a class="tab" href="#/lists" data-tab="lists">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.3l1.6 1.6 2.9-3.2M3.5 12.3l1.6 1.6 2.9-3.2M3.5 18.3l1.6 1.6 2.9-3.2"/><path d="M11 6.8h9.5M11 12.8h9.5M11 18.8h9.5"/></g></svg>
      <span>רשימות</span>
    </a>
  </nav>

  <div class="backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div class="backdrop alert-backdrop" id="alert-backdrop" hidden></div>
  <div class="alert" id="alert" role="alertdialog" aria-modal="true" tabindex="-1" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/guide.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
